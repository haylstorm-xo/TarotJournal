<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Journal & Calendar</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Global Theme & Color Variables */
    :root {
      --bg-dark: #12101c;
      --panel-bg: #1e1b29;
      --accent-gold: #c4a46a;
      --text-main: #ffffff;
      --text-muted: #8b869c;
      --border-purple: #4c3a6b;
      --active-purple: #5c3d91;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      min-height: 100vh;
    }

    /* --- CALENDAR INTERFACE --- */
    .calendar-container {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .calendar-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .calendar-title {
      font-family: 'Georgia', serif;
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin: 0 0 8px 0;
    }

    .calendar-subtitle {
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    /* Grid Frame */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    /* Day Name Labels (Mon, Tue, etc) */
    .day-name {
      text-align: center;
      color: var(--accent-gold);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 8px;
    }

    /* Interactive Day Box */
    .calendar-day {
      background-color: var(--panel-bg);
      border: 1px solid rgba(139, 134, 156, 0.15);
      border-radius: 14px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }

    .calendar-day:hover {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    /* --- BACKDROP & MODAL ARCHITECTURE --- */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(10, 8, 16, 0.85);
      backdrop-filter: blur(4px);
      display: none; /* Controlled by JS toggle */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--panel-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--text-main); }

    .date-sub {
      color: var(--accent-gold);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .date-main {
      font-family: 'Georgia', serif;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
    }

    .moon-phase {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .section-title {
      color: var(--accent-gold);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 20px 0 10px 0;
    }

    .dropdown-field {
      width: 100%;
      background-color: transparent;
      border: 2px solid var(--border-purple);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      background-color: transparent;
      border: 1px solid rgba(139, 134, 156, 0.3);
      border-radius: 20px;
      padding: 8px 16px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .pill:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .pill.selected-motivation {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .pill.selected-mood {
      background-color: var(--active-purple);
      border-color: var(--border-purple);
      color: var(--text-main);
    }

    .pill::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .pill-happy::before { background-color: #ffd166; }
    .pill-sad::before { background-color: #118ab2; }
    .pill-anxious::before { background-color: #ef476f; }
    .pill-calm::before { background-color: #8338ec; }
    .pill-energized::before { background-color: #f77f00; }
    .pill-tired::before { background-color: #a8dadc; }

    .save-btn {
      width: 100%;
      background-color: var(--accent-gold);
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: #312816;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 28px;
    }
    .save-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <h1 class="calendar-title">May 2026</h1>
      <div class="calendar-subtitle">Cosmic Journal Log</div>
    </div>
    
    <div class="calendar-grid">
      <div class="day-name">Sun</div><div class="day-name">Mon</div><div class="day-name">Tue</div>
      <div class="day-name">Wed</div><div class="day-name">Thu</div><div class="day-name">Fri</div>
      <div class="day-name">Sat</div>
      
      <div id="days-root" style="display: contents;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card">
      <button class="close-btn" id="close-modal-btn">&times;</button>
      
      <div class="date-sub" id="modal-day-name">Friday</div>
      <h2 class="date-main" id="modal-date-display">May 22</h2>
      <div class="moon-phase">🌙 Waxing Crescent</div>

      <div class="section-title">Tarot Card</div>
      <select id="tarot-select" class="dropdown-field">
        <option value="The Emperor">The Emperor</option>
        <option value="The Fool">The Fool</option>
        <option value="The Magician">The Magician</option>
        <option value="The High Priestess">The High Priestess</option>
        <option value="The Empress">The Empress</option>
      </select>

      <div class="section-title">Motivation</div>
      <div class="pill-group" id="motivation-group">
        <button class="pill" data-value="SUPER">Super</button>
        <button class="pill" data-value="VERY">Very</button>
        <button class="pill" data-value="MOTIVATED">Motivated</button>
        <button class="pill" data-value="MODERATELY">Moderately</button>
        <button class="pill" data-value="SLIGHTLY">Slightly</button>
        <button class="pill" data-value="NON">Non</button>
      </div>

      <div class="section-title">Mood</div>
      <div class="pill-group" id="mood-group">
        <button class="pill pill-happy" data-value="HAPPY">Happy</button>
        <button class="pill pill-sad" data-value="SAD">Sad</button>
        <button class="pill pill-anxious" data-value="ANXIOUS">Anxious</button>
        <button class="pill pill-calm" data-value="CALM">Calm</button>
        <button class="pill pill-energized" data-value="ENERGIZED">Energized</button>
        <button class="pill pill-tired" data-value="TIRED">Tired</button>
      </div>

      <button class="save-btn" id="save-day-btn">Save Day</button>
    </div>
  </div>

  <script>
    // 1. --- SUPABASE SETUP ---
    const SUPABASE_URL = "https://hxvggfgbxlfodhwcrlpg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_dOsp-_F6er6b3dhdS-kR7Q_Seam5Ekr"; // Put your sb_publishable key string here!

    let supabaseClient = null;
    try {
      if (SUPABASE_KEY && !SUPABASE_KEY.includes("YOUR_COPIED_PUBLISHABLE_KEY")) {
        // Use window.supabase to target the script library asset securely
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (err) {
      console.error("Initialization warning:", err);
    }

    // 2. --- STATE ARCHITECTURE ---
    let selectedMotivation = "";
    let selectedMoods = [];
    let activeSelectedDate = "";

    const daysRoot = document.getElementById('days-root');
    const backdrop = document.getElementById('modal-backdrop');
    const dateDisplay = document.getElementById('modal-date-display');
    const dayNameDisplay = document.getElementById('modal-day-name');

    const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    // 3. --- GENERATE CALENDAR ---
    const startingOffset = 5; // May 2026 starts on Friday
    const totalDaysInMonth = 31;

    for (let i = 0; i < startingOffset; i++) {
      const blank = document.createElement('div');
      daysRoot.appendChild(blank);
    }

    for (let day = 1; day <= totalDaysInMonth; day++) {
      const daySquare = document.createElement('div');
      daySquare.classList.add('calendar-day');
      daySquare.innerText = day;

      const currentWeekdayIndex = (startingOffset + day - 1) % 7;
      const dayName = weekdays[currentWeekdayIndex];
      
      const dayString = day < 10 ? `0${day}` : day;
      const fullDateISO = `2026-05-${dayString}`;

      daySquare.addEventListener('click', () => {
        activeSelectedDate = fullDateISO;
        dayNameDisplay.innerText = dayName;
        dateDisplay.innerText = `May ${day}`;
        
        resetFormState();
        backdrop.style.display = 'flex';
      });

      daysRoot.appendChild(daySquare);
    }

    // 4. --- FORM INTERACTION LOGIC ---
    const motivationPills = document.querySelectorAll('#motivation-group .pill');
    motivationPills.forEach(pill => {
      pill.addEventListener('click', () => {
        motivationPills.forEach(p => p.classList.remove('selected-motivation'));
        pill.classList.add('selected-motivation');
        selectedMotivation = pill.getAttribute('data-value');
      });
    });

    const moodPills = document.querySelectorAll('#mood-group .pill');
    moodPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const val = pill.getAttribute('data-value');
        if (selectedMoods.includes(val)) {
          selectedMoods = selectedMoods.filter(item => item !== val);
          pill.classList.remove('selected-mood');
        } else {
          selectedMoods.push(val);
          pill.classList.add('selected-mood');
        }
      });
    });

    function resetFormState() {
      selectedMotivation = "";
      selectedMoods = [];
      motivationPills.forEach(p => p.classList.remove('selected-motivation'));
      moodPills.forEach(p => p.classList.remove('selected-mood'));
      document.getElementById('tarot-select').selectedIndex = 0;
    }

    document.getElementById('close-modal-btn').addEventListener('click', () => backdrop.style.display = 'none');

    // 5. --- SAVE ACTION ---
    document.getElementById('save-day-btn').addEventListener('click', async () => {
      const journalPayload = {
        date: activeSelectedDate,
        tarot: document.getElementById('tarot-select').value,
        motivation: selectedMotivation,
        moods: selectedMoods
      };

      if (!supabaseClient) {
        alert(`Demo Mode: Data logged locally for ${activeSelectedDate}! (To connect live, add your key string)`);
        backdrop.style.display = 'none';
        return;
      }

      const { data, error } = await supabaseClient
        .from('journal_entries')
        .upsert([journalPayload], { onConflict: 'date' }); 

      if (error) {
        console.error('Database Sync Failure:', error.message);
        alert('Database Sync Error: ' + error.message);
      } else {
        alert(`Journal log for ${activeSelectedDate} safely stored in Supabase!`);
        backdrop.style.display = 'none';
      }
    });
  </script>
</body>
</html>
