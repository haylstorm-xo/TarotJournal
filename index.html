<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Journal & Calendar</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Global Theme & Color Variables */
    :root {
      --bg-dark: #12101c;
      --panel-bg: #1e1b29;
      --accent-gold: #c4a46a;
      --text-main: #ffffff;
      --text-muted: #8b869c;
      --border-purple: #4c3a6b;
      --active-purple: #5c3d91;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      min-height: 100vh;
    }

    /* --- CALENDAR INTERFACE --- */
    .calendar-container {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .calendar-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .calendar-title {
      font-family: 'Georgia', serif;
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin: 0 0 8px 0;
    }

    .calendar-subtitle {
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    /* Grid Frame */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    /* Day Name Labels (Mon, Tue, etc) */
    .day-name {
      text-align: center;
      color: var(--accent-gold);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 8px;
    }

    /* Interactive Day Box */
    .calendar-day {
      background-color: var(--panel-bg);
      border: 1px solid rgba(139, 134, 156, 0.15);
      border-radius: 14px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }

    .calendar-day:hover {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    /* Tiny indicator dot showing a day has saved data */
    .has-data::after {
      content: '';
      position: absolute;
      bottom: 8px;
      width: 5px;
      height: 5px;
      background-color: var(--accent-gold);
      border-radius: 50%;
    }


    /* --- BACKDROP & MODAL ARCHITECTURE --- */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(10, 8, 16, 0.85);
      backdrop-filter: blur(4px);
      display: none; /* Controlled by JS toggle */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--panel-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--text-main); }

    .date-sub {
      color: var(--accent-gold);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .date-main {
      font-family: 'Georgia', serif;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 0 6px 0;
    }

    .moon-phase {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .section-title {
      color: var(--accent-gold);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 20px 0 10px 0;
    }

    .dropdown-field {
      width: 100%;
      background-color: transparent;
      border: 2px solid var(--border-purple);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      background-color: transparent;
      border: 1px solid rgba(139, 134, 156, 0.3);
      border-radius: 20px;
      padding: 8px 16px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .pill:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .pill.selected-motivation {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .pill.selected-mood {
      background-color: var(--active-purple);
      border-color: var(--border-purple);
      color: var(--text-main);
    }

    .pill::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .pill-happy::before { background-color: #ffd166; }
    .pill-sad::before { background-color: #118ab2; }
    .pill-anxious::before { background-color: #ef476f; }
    .pill-calm::before { background-color: #8338ec; }
    .pill-energized::before { background-color: #f77f00; }
    .pill-tired::before { background-color: #a8dadc; }

    .save-btn {
      width: 100%;
      background-color: var(--accent-gold);
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: #312816;
